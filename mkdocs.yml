site_name: KF Documentation
site_description: Architecture, process, and business documentation for Knight Frank Hub

docs_dir: Vault

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/mermaid-init.js

exclude_docs: |
  AGENTS.md
  raw/**
  archive/**
  prompts/**

nav:
  - Home: README.md
  - Hub:
      - Overview: projects/Hub/README.md
      - Architecture blueprint: projects/Hub/architecture-blueprint.md
      - Source inventory: projects/Hub/source-inventory.md
      - Message and transport inventory: projects/Hub/message-transport-inventory.md
      - Process flows: projects/Hub/process-flows.md
      - Business rules: projects/Hub/business-rules.md
