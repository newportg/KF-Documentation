site_name: KF Documentation
site_description: Architecture, process, and business documentation for Knight Frank Hub

docs_dir: Vault

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/mermaid-init.js

exclude_docs: |
  AGENTS.md
  raw/**
  archive/**
  prompts/**

nav:
  - Home: README.md
  - Hub:
      - Welcome & Getting Started: projects/Hub/00-WELCOME.md
      - Quick Reference: projects/Hub/QUICK-REFERENCE.md
      - Core Business Domain:
          - Overview: projects/Hub/Core Business Domain/CORE-DOMAIN.md
          - API Workflows: projects/Hub/Core Business Domain/API-WORKFLOWS.md
          - State Machines & Validators: projects/Hub/Core Business Domain/STATE-MACHINES-VALIDATORS.md
      - Architecture & Infrastructure:
          - Architecture blueprint: projects/Hub/Architecture & Infrastructure/architecture-blueprint.md
          - Source inventory: projects/Hub/Architecture & Infrastructure/source-inventory.md
          - Message and transport inventory: projects/Hub/Architecture & Infrastructure/message-transport-inventory.md
          - Process flows: projects/Hub/Architecture & Infrastructure/process-flows.md
          - Business rules: projects/Hub/Architecture & Infrastructure/business-rules.md
          - Angular GUI analysis: projects/Hub/Architecture & Infrastructure/angular-gui-analysis.md
      - GUI:
          - GUI documentation: projects/Hub/GUI/README.md
          - Parity specification: projects/Hub/GUI/PARITY-SPECIFICATION.md
          - Layout and sizing: projects/Hub/GUI/layout-and-sizing.md
          - Page specifications:
              - Page overview: projects/Hub/GUI/pages/README.md
              - Route inventory: projects/Hub/GUI/pages/route-inventory.md
              - Core form specifications: projects/Hub/GUI/pages/core-form-specifications.md
              - Dashboard: projects/Hub/GUI/pages/dashboard.md
              - Contact: projects/Hub/GUI/pages/contact.md
              - Property: projects/Hub/GUI/pages/property.md
              - Activity: projects/Hub/GUI/pages/activity.md
              - Requirement: projects/Hub/GUI/pages/requirement.md
              - Tenancy: projects/Hub/GUI/pages/tenancy.md
              - Company: projects/Hub/GUI/pages/company.md
              - Offer: projects/Hub/GUI/pages/offer.md
              - Instruction, pitch, and referral: projects/Hub/GUI/pages/instruction-pitch-referral.md
              - Marketing, reports, and administration: projects/Hub/GUI/pages/marketing-reports-administration.md
              - Property asset pages: projects/Hub/GUI/pages/property-assets.md
              - Quick create, preferences, and outcomes: projects/Hub/GUI/pages/quick-create-preferences-outcomes.md
          - Control catalogue: projects/Hub/GUI/control-catalogue.md
          - Interaction and validation matrix: projects/Hub/GUI/interaction-validation-matrix.md
          - Navigation and access: projects/Hub/GUI/navigation-and-access.md
          - Screen catalogue: projects/Hub/GUI/screen-catalogue.md
          - User interactions and workflows: projects/Hub/GUI/user-interactions-and-workflows.md
          - Shared UI and feedback: projects/Hub/GUI/shared-ui-and-feedback.md
          - API interaction contract: projects/Hub/GUI/api-interaction-contract.md
          - Validation schema inventory: projects/Hub/GUI/validation-schema-inventory.md
          - P1 page-contract coverage: projects/Hub/GUI/p1-page-contract-coverage.md
          - P2 field catalogue: projects/Hub/GUI/p2-field-catalogue.md
          - Traceability and open questions: projects/Hub/GUI/traceability-and-open-questions.md
          - Screenshot evidence: projects/Hub/GUI/screenshot-evidence.md
      - Planning & Tracking:
          - Project Overview: projects/Hub/Planning & Tracking/README.md
